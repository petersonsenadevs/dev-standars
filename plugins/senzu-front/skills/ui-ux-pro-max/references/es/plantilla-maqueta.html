<!doctype html>
<!--
PLANTILLA DE MAQUETA CON OPINIÓN POR PIEZAS (references/es/rondas.md)
Cópiala a design-system/<slug>/propuestas/ronda-<N>/<letra>.html y rellena SOLO lo marcado entre dobles
llaves (ronda-check falla si queda alguno).
Reglas:
  - Cada decisión visual opinable lleva data-pieza="<LETRA>·<CAT><n>" (A·T1, B·B2…), data-cat y data-desc.
    Categorías y letra: T tipografía · C color · B botones · F formas y radios · L layout · I imágenes ·
    N iconos · M movimiento · X textos y tono · V versión móvil (references/es/movil.md: el menú, el orden,
    el efecto o el tamaño que cambian en táctil; al menos una V por maqueta). Ponlo en elementos contenedores (h1, section, a, button, div),
    nunca en img ni input.
  - Lo que viene FIJADO de rondas anteriores lleva además data-fijado (se ve con candado y no se vota).
  - Lo NUEVO que el usuario aún no ha visto lleva data-nuevo (se ve con la etiqueta NUEVO).
  - Banner superior obligatorio. El panel de opinión y su script no se tocan.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{Proyecto}} · Ronda {{N}} · Maqueta {{LETRA}}</title>
{{<link de Google Fonts de ESTA maqueta>}}
<style>
:root {
  /* Tokens de ESTA maqueta (los fijados, idénticos en todas las maquetas de la ronda) */
  {{--color-fondo: #…; --color-texto: #…; --color-acento: #…; --fuente-titulos: '…'; --fuente-texto: '…'; --radio: …;}}
}
/* ---------- maqueta ---------- */
{{estilos de la maqueta}}

/* ---------- sistema de opinión (no tocar) ---------- */
.ds-banner { position: sticky; top: 0; z-index: 50; background: #111; color: #fff; font: 600 13px/1.4 system-ui, sans-serif; padding: 8px 16px; display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.ds-banner small { opacity: .75; font-weight: 400; }
.ds-banner button { font: inherit; background: #fff; color: #111; border: 0; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
body.ds-ver [data-pieza] { outline: 2px dashed rgba(255, 64, 129, .7); outline-offset: 3px; position: relative; }
body.ds-ver [data-pieza]::before { content: attr(data-pieza); position: absolute; top: -12px; left: -6px; z-index: 40; background: #ff4081; color: #fff; font: 700 11px/1 system-ui, sans-serif; padding: 3px 6px; border-radius: 4px; letter-spacing: .02em; }
body.ds-ver [data-nuevo]::before { content: attr(data-pieza) " · NUEVO"; background: #00897b; }
body.ds-ver [data-fijado]::before { content: attr(data-pieza) " · FIJADO"; background: #555; }
.ds-op-boton { position: fixed; right: 16px; bottom: 16px; z-index: 60; font: 600 14px system-ui, sans-serif; background: #111; color: #fff; border: 0; border-radius: 999px; padding: 12px 18px; box-shadow: 0 6px 20px rgba(0,0,0,.25); cursor: pointer; }
.ds-op { box-sizing: border-box; position: fixed; right: 16px; bottom: 72px; z-index: 60; width: min(380px, calc(100vw - 32px)); max-height: 70vh; overflow: auto; background: #fff; color: #111; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.3); font: 14px/1.4 system-ui, sans-serif; padding: 14px; display: none; }
.ds-op.abierto { display: block; }
.ds-op h3 { margin: 10px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #666; }
.ds-op .fila { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid #eee; }
.ds-op .fila span { flex: 1; }
.ds-op .fila b { font-size: 12px; color: #ff4081; }
.ds-op .fila button { border: 1px solid #ddd; background: #fff; border-radius: 8px; padding: 4px 8px; cursor: pointer; font-size: 16px; min-width: 40px; min-height: 36px; }
.ds-op .fila button.si { background: #e0f2f1; border-color: #00897b; }
.ds-op .fila button.no { background: #fce4ec; border-color: #d81b60; }
.ds-op textarea { width: 100%; box-sizing: border-box; min-height: 70px; margin-top: 8px; font: inherit; border: 1px solid #ddd; border-radius: 8px; padding: 8px; }
.ds-op .copiar { width: 100%; margin-top: 8px; background: #111; color: #fff; border: 0; border-radius: 8px; padding: 10px; font: 600 14px system-ui, sans-serif; cursor: pointer; }
.ds-op .aviso { font-size: 12px; color: #00897b; min-height: 1em; margin-top: 6px; }
</style>
</head>
<body>
<div class="ds-banner" id="ds-banner">
  <span>PROPUESTA · Ronda {{N}} · Maqueta {{LETRA}} — baja fidelidad, para elegir <small>{{Qué cambia respecto a la ronda anterior, en una línea}}</small></span>
  <button type="button" id="ds-ver">Ver piezas</button>
</div>

{{CONTENIDO DE LA MAQUETA: secciones del blueprint aprobado, con data-pieza en cada decisión opinable. Ejemplo:
<h1 data-pieza="{{LETRA}}·T1" data-cat="Tipografía" data-desc="Titulares en Fraunces 600">…</h1>
<a class="boton" data-pieza="{{LETRA}}·B1" data-cat="Botones" data-desc="Botón principal en píldora sólida">Pide presupuesto</a>
<section data-pieza="{{LETRA}}·L1" data-cat="Layout" data-desc="Hero partido: texto a la izquierda, foto a la derecha" data-nuevo>…</section>
<button class="burger" data-pieza="{{LETRA}}·V1" data-cat="Versión móvil" data-desc="En móvil: menú burger a pantalla completa; el teléfono, fuera del menú" aria-label="Menú" aria-expanded="false">Menú</button>}}

<button type="button" class="ds-op-boton" id="ds-op-boton">Tu opinión</button>
<div class="ds-op" id="opinion" role="dialog" aria-label="Tu opinión sobre esta maqueta">
  <strong>¿Qué te gusta y qué no?</strong>
  <div id="ds-lista"></div>
  <textarea id="ds-comentario" placeholder="Algo más: «más aire entre secciones», «el verde muy apagado»…"></textarea>
  <button type="button" class="copiar" id="ds-copiar">Copiar para pegarlo en el chat</button>
  <div class="aviso" id="ds-aviso" aria-live="polite"></div>
</div>
<script>
(function () {
  // Texto que el usuario pega en el chat. Función pura: la prueba tools/test-rondas.mjs la ejecuta tal cual.
  function textoOpinion(titulo, piezas, votos, comentario) {
    var si = [], no = [];
    piezas.forEach(function (p) {
      var t = p.id + ' (' + p.cat + ': ' + p.desc + ')';
      if (votos[p.id] === 'si') si.push(t);
      if (votos[p.id] === 'no') no.push(t);
    });
    var l = ['Opinión · ' + titulo];
    l.push('Me gusta: ' + (si.length ? si.join('; ') : '—'));
    l.push('No me gusta: ' + (no.length ? no.join('; ') : '—'));
    if (comentario && comentario.trim()) l.push('Comentario: ' + comentario.trim());
    return l.join('\n');
  }
  if (typeof document === 'undefined') { if (typeof module !== 'undefined') module.exports = { textoOpinion: textoOpinion }; return; }
  var clave = 'ds-opinion:' + location.pathname;
  var estado = { votos: {}, comentario: '' };
  try { estado = JSON.parse(localStorage.getItem(clave)) || estado; } catch (e) {}
  var guardar = function () { try { localStorage.setItem(clave, JSON.stringify(estado)); } catch (e) {} };
  var piezas = [].slice.call(document.querySelectorAll('[data-pieza]:not([data-fijado])')).map(function (el) {
    return { id: el.getAttribute('data-pieza'), cat: el.getAttribute('data-cat') || 'Otros', desc: el.getAttribute('data-desc') || '', el: el };
  });
  var lista = document.getElementById('ds-lista');
  var porCat = {};
  piezas.forEach(function (p) { (porCat[p.cat] = porCat[p.cat] || []).push(p); });
  Object.keys(porCat).forEach(function (cat) {
    var h = document.createElement('h3'); h.textContent = cat; lista.appendChild(h);
    porCat[cat].forEach(function (p) {
      var fila = document.createElement('div'); fila.className = 'fila';
      var etq = document.createElement('span');
      etq.innerHTML = '<b></b> '; etq.querySelector('b').textContent = p.id; etq.appendChild(document.createTextNode(p.desc));
      etq.style.cursor = 'pointer';
      etq.onclick = function () { document.body.classList.add('ds-ver'); p.el.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
      fila.appendChild(etq);
      ['si', 'no'].forEach(function (v) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = v === 'si' ? 'Sí' : 'No';
        b.setAttribute('aria-label', (v === 'si' ? 'Me gusta ' : 'No me gusta ') + p.id);
        var pintar = function () { b.className = estado.votos[p.id] === v ? v : ''; };
        b.onclick = function () { estado.votos[p.id] = estado.votos[p.id] === v ? undefined : v; guardar(); render(); };
        b._pintar = pintar; fila.appendChild(b);
      });
      lista.appendChild(fila);
    });
  });
  function render() { [].forEach.call(lista.querySelectorAll('button'), function (b) { b._pintar && b._pintar(); }); }
  render();
  var com = document.getElementById('ds-comentario');
  com.value = estado.comentario || '';
  com.oninput = function () { estado.comentario = com.value; guardar(); };
  document.getElementById('ds-ver').onclick = function () { document.body.classList.toggle('ds-ver'); };
  document.getElementById('ds-op-boton').onclick = function () { document.getElementById('opinion').classList.toggle('abierto'); };
  document.getElementById('ds-copiar').onclick = function () {
    var t = textoOpinion(document.title, piezas, estado.votos, estado.comentario);
    var aviso = document.getElementById('ds-aviso');
    var plan = function () { com.value = t; com.select(); aviso.textContent = 'Selecciona el texto de arriba y cópialo (Ctrl+C).'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { aviso.textContent = 'Copiado. Pégalo en el chat.'; }, plan);
    else plan();
  };
})();
</script>
</body>
</html>

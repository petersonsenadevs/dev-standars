<!--
  loading-overlay.html: overlay de progreso accesible para escenas 3D.

  Uso con LoadingManager (vanilla) o useProgress (drei/cientos):
    const overlay = document.querySelector('[data-loading]');
    const bar = overlay.querySelector('[data-loading-bar]');
    const label = overlay.querySelector('[data-loading-label]');
    manager.onProgress = (url, loaded, total) => {
      const ratio = loaded / total;
      bar.style.transform = `scaleX(${ratio})`;
      overlay.setAttribute('aria-valuenow', String(Math.round(ratio * 100)));
      label.textContent = `${Math.round(ratio * 100)} %`;
    };
    manager.onLoad = () => {
      overlay.classList.add('is-done');
      overlay.addEventListener('transitionend', () => overlay.remove(), { once: true });
    };

  Notas de accesibilidad:
  - role="progressbar" con aria-valuenow/min/max y aria-label describe el estado a lectores de pantalla.
  - aria-live="polite" en el texto para anunciar cambios sin interrumpir (se actualiza a saltos, no cada 1 %).
  - aria-busy en el contenedor de la escena mientras carga.
  - El overlay no atrapa el foco ni bloquea el resto de la página; si es un hero, el contenido
    HTML sigue siendo accesible debajo.
  - Con prefers-reduced-motion se elimina la animación del shimmer y la transición de salida.
-->

<div class="scene" aria-busy="true" data-scene>
  <img class="scene__poster" src="/images/hero-poster.webp" alt="" aria-hidden="true" width="1600" height="900" />
  <canvas class="scene__canvas" data-three-canvas aria-hidden="true"></canvas>

  <div
    class="loading"
    data-loading
    role="progressbar"
    aria-label="Cargando escena 3D"
    aria-valuemin="0"
    aria-valuemax="100"
    aria-valuenow="0"
  >
    <div class="loading__track">
      <div class="loading__bar" data-loading-bar></div>
    </div>
    <p class="loading__label" aria-live="polite" data-loading-label>0 %</p>
    <p class="loading__hint">Cargando modelo 3D</p>
  </div>

  <p class="scene__fallback" data-fallback hidden>
    Tu navegador no puede mostrar la escena 3D. Se muestra una imagen estática.
  </p>
</div>

<style>
  .scene {
    position: relative;
    width: 100%;
    height: 80vh;
    min-height: 360px;
    overflow: hidden;
    background: #0b0b0f;
    color: #ffffff;
  }

  .scene__poster,
  .scene__canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block; /* evita el hueco inline de 4 px */
  }

  .scene__poster {
    object-fit: cover;
    transition: opacity 600ms ease;
  }

  .scene__canvas {
    opacity: 0;
    transition: opacity 600ms ease;
    touch-action: pan-y;
  }

  .scene[data-three-state='ready'] .scene__canvas { opacity: 1; }
  .scene[data-three-state='ready'] .scene__poster { opacity: 0; }
  .scene[data-three-state='unsupported'] .scene__fallback,
  .scene[data-three-state='error'] .scene__fallback { display: block; }

  .loading {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 0.75rem;
    justify-items: center;
    background: rgb(11 11 15 / 0.6);
    backdrop-filter: blur(4px);
    transition: opacity 400ms ease, visibility 0s linear 400ms;
    pointer-events: none;
  }

  .loading.is-done {
    opacity: 0;
    visibility: hidden;
  }

  .loading__track {
    width: min(240px, 60vw);
    height: 3px;
    border-radius: 999px;
    background: rgb(255 255 255 / 0.15);
    overflow: hidden;
  }

  .loading__bar {
    height: 100%;
    width: 100%;
    background: currentColor;
    transform-origin: left center;
    transform: scaleX(0);
    transition: transform 200ms ease;
    position: relative;
  }

  .loading__bar::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.5), transparent);
    animation: shimmer 1.4s linear infinite;
  }

  .loading__label {
    margin: 0;
    font-variant-numeric: tabular-nums;
    font-size: 0.875rem;
    letter-spacing: 0.04em;
  }

  .loading__hint {
    margin: 0;
    font-size: 0.75rem;
    opacity: 0.7;
  }

  .scene__fallback {
    position: absolute;
    left: 1rem;
    bottom: 1rem;
    margin: 0;
    padding: 0.5rem 0.75rem;
    border-radius: 0.5rem;
    background: rgb(0 0 0 / 0.6);
    font-size: 0.8125rem;
  }

  @keyframes shimmer {
    from { transform: translateX(-100%); }
    to { transform: translateX(100%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .scene__poster,
    .scene__canvas,
    .loading,
    .loading__bar {
      transition: none;
    }
    .loading__bar::after {
      animation: none;
    }
  }
</style>

<script type="module">
  // Ejemplo de integración mínima (vanilla). Sustituye por tu clase Scene.
  const root = document.querySelector('[data-scene]');
  const overlay = root.querySelector('[data-loading]');
  const bar = overlay.querySelector('[data-loading-bar]');
  const label = overlay.querySelector('[data-loading-label]');
  const fallback = root.querySelector('[data-fallback]');

  let lastAnnounced = -1;
  function setProgress(ratio) {
    const pct = Math.round(ratio * 100);
    bar.style.transform = `scaleX(${ratio})`;
    overlay.setAttribute('aria-valuenow', String(pct));
    // Anuncia en saltos de 25 % para no saturar el lector de pantalla.
    if (pct === 100 || Math.floor(pct / 25) > Math.floor(lastAnnounced / 25)) {
      label.textContent = `${pct} %`;
      lastAnnounced = pct;
    }
  }

  function done() {
    root.setAttribute('aria-busy', 'false');
    root.dataset.threeState = 'ready';
    overlay.classList.add('is-done');
    overlay.addEventListener('transitionend', () => overlay.remove(), { once: true });
  }

  function unsupported() {
    root.setAttribute('aria-busy', 'false');
    root.dataset.threeState = 'unsupported';
    overlay.remove();
    fallback.hidden = false;
  }

  window.__sceneLoading = { setProgress, done, unsupported };
</script>

# deptrac.yaml — reglas de dependencia para el monolito modular.
# Instalar: composer require --dev qossmic/deptrac
# Ejecutar: vendor/bin/deptrac analyse --fail-on-uncovered --report-uncovered
#
# Capas técnicas (Domain / Application / Infrastructure) + una capa por contexto.
# Regla: Domain no depende de nada; Application solo de Domain; Infrastructure de todo.
# Entre contextos: prohibido, salvo Shared.

deptrac:
  paths:
    - ./src
    - ./app
  exclude_files:
    - '#.*Test\.php$#'

  layers:
    # ---- Capas técnicas (aplican a todos los contextos en src/) ----
    - name: Domain
      collectors:
        - { type: directory, value: 'src/[^/]+/Domain/.*' }
    - name: Application
      collectors:
        - { type: directory, value: 'src/[^/]+/Application/.*' }
    - name: Infrastructure
      collectors:
        - { type: directory, value: 'src/[^/]+/Infrastructure/.*' }
    - name: App            # app/: adaptadores globales de Laravel (Http, Console, Providers)
      collectors:
        - { type: directory, value: 'app/.*' }

    # ---- Framework y librerías ----
    - name: Laravel
      collectors:
        - { type: classNameRegex, value: '/^(Illuminate|Laravel|Inertia|Carbon)\\/' }
    - name: LaravelTransaction   # excepción tolerada en Application
      collectors:
        - { type: classNameRegex, value: '/^Illuminate\\Support\\Facades\\DB$/' }
    - name: Psr
      collectors:
        - { type: classNameRegex, value: '/^Psr\\/' }

    # ---- Contextos (uno por módulo) ----
    - name: Invoicing
      collectors:
        - { type: directory, value: 'src/Invoicing/.*' }
    - name: Sales
      collectors:
        - { type: directory, value: 'src/Sales/.*' }
    - name: Shared
      collectors:
        - { type: directory, value: 'src/Shared/.*' }

  ruleset:
    # Capas técnicas
    Domain: []                                   # solo Domain (mismo layer) y PHP puro
    Application: [Domain, LaravelTransaction, Psr]
    Infrastructure: [Domain, Application, Laravel, LaravelTransaction, Psr]
    App: [Application, Infrastructure, Laravel, Psr]   # app/ cablea; no toca internals de Domain

    # Contextos: cada uno solo consigo mismo y Shared. Integración por eventos/ids/puertos.
    Invoicing: [Shared]
    Sales: [Shared]
    Shared: []

  # Violaciones conocidas mientras se migra legacy. Vaciar con el tiempo.
  skip_violations:
    # App\Http\Controllers\LegacyInvoiceController:
    #   - Invoicing\Domain\Model\Invoice

  formatters:
    graphviz:
      hidden_layers: [Laravel, Psr, LaravelTransaction]
